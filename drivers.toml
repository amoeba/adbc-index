# ADBC Drivers Configuration
#
# Each driver can be specified in two formats:
# 1. Simple: driver_name = "url" (single URL)
# 2. Detailed: [drivers.driver_name] with urls (array), version, artifact_filter, and language
#
# Language field is optional. If not specified, language will be auto-detected from binaries.

[drivers.bigquery]
urls = [
  "https://pypi.org/project/adbc-driver-bigquery/",
  "https://github.com/adbc-drivers/bigquery"
]
language = "go"

[drivers.clickhouse]
urls = ["https://github.com/adbc-drivers/clickhouse"]
language = "rust"

