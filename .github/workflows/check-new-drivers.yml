name: Check for New DBC Drivers

# Maintains at most one open PR (on a fixed branch) listing drivers that
# appear in `dbc search` but are missing from drivers.toml. The PR is updated
# in place when the set of missing drivers changes, left alone when it hasn't,
# and closed automatically once drivers.toml covers everything.

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM UTC
  workflow_dispatch:

concurrency:
  group: check-new-drivers
  cancel-in-progress: false

env:
  BRANCH: bot/new-dbc-drivers

jobs:
  check-drivers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: columnar-tech/setup-dbc@v1
        with:
          skip-drivers: true

      - name: Get current driver list
        run: |
          dbc search | awk 'NF {print $1}' | sort -u > /tmp/current-drivers.txt
          cat /tmp/current-drivers.txt

      - name: Check for new drivers
        id: diff
        run: |
          # Parse drivers.toml properly so both `name = "url"` and
          # `[drivers.name]` forms are recognized.
          python3 -c 'import tomllib; print("\n".join(tomllib.load(open("drivers.toml", "rb"))["drivers"]))' \
            | sort -u > /tmp/known-drivers.txt

          comm -13 /tmp/known-drivers.txt /tmp/current-drivers.txt > /tmp/new-drivers.txt
          echo "Missing drivers:"
          cat /tmp/new-drivers.txt
          echo "list=$(paste -sd ' ' /tmp/new-drivers.txt)" >> "$GITHUB_OUTPUT"

      - name: Find existing bot PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          if [ -n "$NUM" ]; then
            TITLE=$(gh pr view "$NUM" --json title --jq .title)
            echo "Existing PR #$NUM: $TITLE"
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          fi

      - name: Close bot PR (nothing missing)
        if: steps.diff.outputs.list == '' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr close "${{ steps.pr.outputs.number }}" --delete-branch \
            --comment "All drivers from \`dbc search\` are now present in \`drivers.toml\`; closing automatically."

      - name: Open or update bot PR
        if: steps.diff.outputs.list != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_LIST: ${{ steps.diff.outputs.list }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: |
          TITLE="Add stub entries for new DBC drivers: $NEW_LIST"

          if [ -n "$PR_NUMBER" ] && [ "$PR_TITLE" = "$TITLE" ]; then
            echo "PR #$PR_NUMBER already covers: $NEW_LIST — nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"

          # Append a stub entry for each new driver
          echo "" >> drivers.toml
          while IFS= read -r driver; do
            printf '\n[drivers.%s]\nurls = ["# TODO: add source URL"]\n' "$driver" >> drivers.toml
          done < /tmp/new-drivers.txt

          git add drivers.toml
          git commit -m "Add stub entries for new DBC drivers: $NEW_LIST"
          git push --force origin "$BRANCH"

          BODY="The following drivers appeared in \`dbc search\` but are missing from \`drivers.toml\`. Stub entries have been added — fill in the source URLs before merging (or add the drivers on \`main\` and this PR will close itself).

          $(sed 's/^/- /' /tmp/new-drivers.txt)

          Run \`dbc info <driver>\` for details on each.

          _This PR is maintained by the \`check-new-drivers\` workflow and is updated in place rather than reopened daily._"

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh pr create --title "$TITLE" --body "$BODY" --base main --head "$BRANCH"
          fi
